<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="feedback-page">
    <header>
        <h1>Виды фотографии</h1>
        <nav>
            <a href="index.html#photo">Фотография</a>
            <a href="index.html#types">Основные виды фотографии</a>
            <a href="index.html#objects">Объекты съёмки</a>
            <a href="index.html#contacts">Контакты</a>
            <a href="login.html">Войти</a>
            <a href="feedback.html">Обратная связь</a>
        </nav>
    </header>
    <form class="feedback-form"
        action="https://httpbin.org/post"
        method="POST"
        enctype="multipart/form-data">

        <h1>Форма обратной связи</h1>

        <label for="name">ФИО:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <p>Откуда узнали о нас?</p>

        <label>
            <input type="radio" name="source" value="internet" required>
            Из Интернета
        </label>

        <label>
            <input type="radio" name="source" value="friends">
            От друзей
        </label>

        <label for="type">Тип обращения:</label>
        <select id="type" name="type">
            <option value="complaint">Жалоба</option>
            <option value="suggestion">Предложение</option>
        </select>

        <label for="message">Текст сообщения:</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <label for="file">Вложение:</label>
        <input type="file" id="file" name="file">

        <label>
            <input type="checkbox" name="agreement" required>
            Даю согласие на обработку персональных данных
        </label>

        <button type="submit">Отправить</button>

    </form>
    <footer id="contacts">
    <p>Почта: vasovsergej@gmail.com</p>
    <p>© 2026</p>
</footer>
</body>
</html>
